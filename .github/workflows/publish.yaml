# CI validates pull requests and main. The version files hold the last released or the
# next rc/stable version. A main push whose committed version is already tagged on origin
# publishes a dev build derived from it; a main push whose version is not tagged yet (a
# release PR merge) is verified without publication; a published GitHub Release publishes it.
# Every publishing mode first runs the deployed live smoke: dev builds against the dev
# environment, release verification and releases against production.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Validate locked source and installed package
        run: |
          npm ci
          npm run lint
          npm run check:version
          npm run typecheck
          npm test
          npm run test:package

  publish:
    needs: validate
    if: >-
      github.repository == 'lambdadb/lambdadb-cli' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # The live suite alone may take up to 15 minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Never interrupt a registry write. New pending main jobs replace older ones.
      group: npm-${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up publishing runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an OIDC-capable npm
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const v=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error("npm >=11.5.1 required");'
      # A committed version already tagged on origin selects a dev build; an untagged
      # rc/stable version on a main push (a release PR merge) is verified only.
      - name: Select the run mode
        id: mode
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(node scripts/version.mjs get)
          if [ "$PUBLISH_EVENT" != "push" ]; then
            MODE=release
          else
            case "$VERSION" in
              *-dev.*) echo "Committed version $VERSION must be an rc or stable version" >&2; exit 1 ;;
            esac
            # Query origin rather than local tags so a shallow or stale checkout cannot
            # misclassify the commit. Exit status 2 means the tag does not exist.
            STATUS=0
            git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || STATUS=$?
            case "$STATUS" in
              0) MODE=dev ;;
              2) MODE=verify ;;
              *) echo "Could not query origin for tag v$VERSION" >&2; exit 1 ;;
            esac
          fi
          # Dev builds are smoke-tested against the dev environment; release verification
          # and rc/stable releases against production.
          if [ "$MODE" = dev ]; then SMOKE_PREFIX=LAMBDADB_DEV_; else SMOKE_PREFIX=LAMBDADB_PROD_; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "smoke_prefix=$SMOKE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "Committed version $VERSION; run mode $MODE; live smoke Variables $SMOKE_PREFIX*"
      - name: Prepare deterministic development version
        if: steps.mode.outputs.mode == 'dev'
        id: dev
        run: node scripts/dev-release.mjs prepare
      - name: Verify committed release metadata without publishing
        if: steps.mode.outputs.mode == 'verify'
        run: node scripts/check-release.mjs --verify
      - name: Verify explicit release metadata and main ancestry
        if: steps.mode.outputs.mode == 'release'
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release.mjs --release
      - name: Pack once and test the exact publication artifact
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        id: package
        shell: bash
        run: |
          npm ci
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/package.json"
          CLI_TARBALL=$(node --input-type=module -e 'import fs from "node:fs"; const file=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package.json","utf8"))[0].filename; console.log(`${process.env.RUNNER_TEMP}/${file}`);')
          npm run test:package -- "$CLI_TARBALL"
          echo "tarball=$CLI_TARBALL" >> "$GITHUB_OUTPUT"
      # The selected environment's Variables only: a missing one stays empty and fails the
      # run instead of falling back to the other environment.
      - name: Authenticate live smoke tests to AWS
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars[format('{0}SMOKE_AWS_ROLE_ARN', steps.mode.outputs.smoke_prefix)] }}
          aws-region: ap-northeast-2
          role-session-name: cli-smoke-${{ github.run_id }}
      - name: Run deployed live smoke tests against the exact publication artifact
        if: steps.mode.outputs.mode != 'dev' || steps.dev.outputs.ready == 'true'
        env:
          CLI_TARBALL: ${{ steps.package.outputs.tarball }}
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.mode.outputs.smoke_prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.mode.outputs.smoke_prefix)] }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars[format('{0}SMOKE_SECRET_ARN', steps.mode.outputs.smoke_prefix)] }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL project $LAMBDADB_PROJECT_NAME"
          npm install --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund "$CLI_TARBALL"
          LAMBDADB_TEST_CLI="$RUNNER_TEMP/smoke/node_modules/@functional-systems/lambdadb-cli/dist/cli.js" \
            node scripts/run-live-smoke.mjs
      - name: Publish development version and verify registry state
        if: >-
          steps.mode.outputs.mode == 'dev' && steps.dev.outputs.ready == 'true' &&
          vars.NPM_DEV_PUBLISH_ENABLED == 'true'
        env:
          CLI_TARBALL: ${{ steps.package.outputs.tarball }}
        run: node scripts/dev-release.mjs publish
      - name: Publish explicit release using npm Trusted Publishing
        if: steps.mode.outputs.mode == 'release'
        env:
          CLI_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish "$CLI_TARBALL" --access public --tag "$NPM_CHANNEL" --provenance
