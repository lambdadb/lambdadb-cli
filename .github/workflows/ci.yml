name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build and run local contract tests
        run: npm test
      - name: Verify installed package executable
        shell: bash
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/cli-package.json"
          cli_package=$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/cli-package.json", "utf8"))[0].filename)')
          npm install --prefix "$RUNNER_TEMP/cli-consumer" "$RUNNER_TEMP/$cli_package"
          cli_bin="$RUNNER_TEMP/cli-consumer/node_modules/.bin/lambdadb"
          expected_version=$(node -p 'require("./package.json").version')
          test "$("$cli_bin" --version)" = "$expected_version"
          "$cli_bin" --help
